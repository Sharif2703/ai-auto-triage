name: "AI Auto Triage Upload"

description: "Uploads failure artifacts to AI triage service"

inputs:
  failure_file:
    description: "Path to failure JSON file"
    required: true

  triage_url:
    description: "Triage service URL"
    required: true

runs:
  using: "composite"

  steps:
    - name: Upload failure artifact
      shell: powershell

      run: |

        Write-Host "Uploading failure artifact..."

        $json = Get-Content "${{ inputs.failure_file }}" -Raw

        $response = Invoke-RestMethod `
          -Uri "${{ inputs.triage_url }}/triage" `
          -Method Post `
          -Body $json `
          -ContentType "application/json"

        Write-Host "Triage Response:"
        $response | ConvertTo-Json